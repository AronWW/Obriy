services:
  postgres:
    image: postgres:17
    container_name: obriy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: obriy
      POSTGRES_PASSWORD: obriy_password
      POSTGRES_DB: obriy_db
    ports:
      - "5433:5432"
    volumes:
      - obriy_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: obriy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@obriy.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  obriy_postgres_data:
